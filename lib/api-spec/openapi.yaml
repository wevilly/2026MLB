    WalkForwardCalibrationPoint:
      type: object
      additionalProperties: false
      properties:
        bucket: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0 }
        predictedProbability: { type: ["number", "null"] }
        observedRate: { type: ["number", "null"] }
      required: [bucket, count, predictedProbability, observedRate]
    WalkForwardValidationResult:
      type: object
      additionalProperties: false
      properties:
        walkForwardRunId: { type: string }
        versionId: { type: string }
        market: { type: string, enum: [TB, XBH, WALK, HR] }
        foldCount: { type: integer, minimum: 0 }
        foldResults: { type: array, items: { type: object } }
        overallMetric: { type: ["number", "null"] }
        benchmarkMetric: { type: ["number", "null"] }
        benchmarkBeat: { type: boolean }
        benchmarkMethod: { type: string }
        calibrationMethod: { type: string }
        benchmarkMargin:
          type: ["number", "null"]
          description: |
            Brier margin the model had to beat, derived from the held-out row
            count rather than being a fixed constant.
        calibrationCurve:
          type: array
          description: Ten-bin reliability curve over the pooled out-of-fold probabilities.
          items: { $ref: "#/components/schemas/WalkForwardCalibrationPoint" }
        expectedCalibrationError:
          type: ["number", "null"]
          description: |
            Expected calibration error over the reliability bins. This is the
            quantity the acceptance gate reads.
        expectedCalibrationErrorThreshold: { type: number }
        meanAbsolutePredictionError:
          type: ["number", "null"]
          description: |
            Mean absolute distance between each prediction and its binary label.
            Reported for continuity with the field previously and wrongly named
            calibrationError. Nothing gates on it.
        brierSkillScore: { type: ["number", "null"] }
        predictionStdDev:
          type: ["number", "null"]
          description: Standard deviation of the pooled predicted probabilities, the sharpness guard.
        predictionStdDevThreshold: { type: number }
        failureReasons:
          type: array
          description: Named reasons the run did not pass. Empty on a PASS.
          items: { type: string }
        calibrationPassed: { type: boolean }
        calibrationSlope: { type: ["number", "null"] }
        calibrationIntercept: { type: ["number", "null"] }
        status: { type: string, enum: [PASS, FAIL, INCOMPLETE] }
      required: [walkForwardRunId, versionId, market, foldCount, foldResults, overallMetric, benchmarkMetric, benchmarkBeat, benchmarkMethod, benchmarkMargin, calibrationMethod, calibrationCurve, expectedCalibrationError, expectedCalibrationErrorThreshold, meanAbsolutePredictionError, brierSkillScore, predictionStdDev, predictionStdDevThreshold, failureReasons, calibrationPassed, calibrationSlope, calibrationIntercept, status]

        positiveCandidates: { type: integer }
        neutralCandidates: { type: integer }
        negativeCandidates: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [market, slateDate, gamesProcessed, candidatesProcessed, candidatesWritten, blockedCandidates, strongCandidates, positiveCandidates, neutralCandidates, negativeCandidates, processingMs, notes, error]
    HREngineResult:
      type: object
      description: |
        Result of a Home Run research engine run.
        RANK_DONT_GATE: produces ordinal research_rank only.
        No odds, EV, CLV, or implied probability is produced.

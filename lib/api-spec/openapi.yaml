        originalSnapshotId: { type: string }
        correctionReason: { type: string }
        correctionNote: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [newSnapshotId, originalSnapshotId, correctionReason, correctionNote, createdAt]
    MarketResearchCandidate:
      type: object
      description: |
        One research candidate for a player-market-slate_date-game combination.
        RANK_DONT_GATE: research_rank is ordinal only; it implies no threshold, gate, or probability.
        Ties share the same integer rank and are never collapsed.
        Prohibited fields absent from this schema: ev, clv, odds, impliedProbability, vigJuice,
        edgePercent, kellyFraction, expectedValue.
      properties:
        candidateId: { type: string }
        slateDate: { type: string, format: date }
        gamePk: { type: integer }
        playerId: { type: integer }
        playerName: { type: string }
        market: { type: string, enum: [TB, XBH, WALK, HR, H_R_RBI] }
        researchRank: { type: ["integer", "null"] }
        researchState: { type: string, enum: [STRONG, POSITIVE, NEUTRAL, NEGATIVE, BLOCKED] }
        primaryMechanism: { type: ["string", "null"] }
        secondaryMechanism: { type: ["string", "null"] }
        opportunityEvidence: { type: object }
        starterMatchupEvidence: { type: object }
        bullpenPathEvidence: { type: object }
        parkEvidence: { type: object }
        recentVsSeasonVsCareer: { type: object }
        counterEvidence: { type: object }
        bvpEvidence:
          anyOf: [{ $ref: "#/components/schemas/BatterPitcherEvidence" }, { type: "null" }]
        missingStaleEvidence: { type: ["string", "null"] }
        identityResolved:
          type: boolean
          description: Whether the player identity has been resolved for the slate.
        selectable:
          type: boolean
          description: Whether this audit row can be added as a Round Robin leg.
        selectionBlockReason:
          type: ["string", "null"]
          enum: [BLOCKED, NEGATIVE, STALE, UNRESOLVED_IDENTITY, INCOMPLETE_EVIDENCE, null]
          description: The reason this row cannot be selected, when applicable.
        operationalState:
          type: string
          enum: [USABLE, AUDIT_ONLY]
          description: Separates rows currently safe for operations from retained audit evidence.
        auditReason: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [candidateId, slateDate, gamePk, playerId, playerName, market, researchRank, researchState, primaryMechanism, secondaryMechanism, opportunityEvidence, starterMatchupEvidence, bullpenPathEvidence, parkEvidence, recentVsSeasonVsCareer, counterEvidence, bvpEvidence, missingStaleEvidence, identityResolved, selectable, selectionBlockReason, operationalState, auditReason, createdAt, updatedAt]
    MarketResearch:
      type: object
      description: |
        Market research board for a given date/market/game.
        Populated by Phase 3A–3D engines. Empty until at least one engine has run.
        The prohibitedFields array documents which analytics are permanently absent from this contract.
      properties:
        date: { type: string, format: date }
        market: { type: ["string", "null"] }
        gameId: { type: ["string", "null"] }
        rankSemantics: { type: string }
        prohibitedFields: { type: array, items: { type: string } }
        candidates: { type: array, items: { $ref: "#/components/schemas/MarketResearchCandidate" } }
        candidateCount: { type: integer }
        selectableCandidateCount:
          type: integer
          minimum: 0
          description: Count of returned candidates that meet the shared Round Robin selection predicate.
        systemNote: { type: string }
        readiness: { $ref: "#/components/schemas/OperationalReadiness" }
      required: [date, market, gameId, rankSemantics, prohibitedFields, candidates, candidateCount, selectableCandidateCount, systemNote, readiness]
    RoundRobinLeg:
      type: object
      description: A candidate evaluated in a game-level Round Robin construction. Research fields are audit context, never betting values.
      properties:
        candidateId: { type: string }
        playerId: { type: integer }
        playerName: { type: string }
        market: { type: string, enum: [TB, XBH, WALK, HR, H_R_RBI] }
        researchRank: { type: ["integer", "null"] }
        researchState: { type: string, enum: [STRONG, POSITIVE, NEUTRAL, NEGATIVE, BLOCKED] }
        lineupState: { type: string, enum: [POSTED, CONFIRMED, PROJECTED, UNKNOWN] }
        starterState: { type: string }
        bvpEvidence: { anyOf: [{ $ref: "#/components/schemas/BatterPitcherEvidence" }, { type: "null" }] }
        arsenalStatus: { type: string }
        evidenceFreshness: { type: string, enum: [CURRENT, STALE, INCOMPLETE] }
        primaryMechanism: { type: ["string", "null"] }
        opportunityEvidence: { type: object }
        starterMatchupEvidence: { type: object }
        bullpenPathEvidence: { type: object }
        parkEvidence: { type: object }
        counterEvidence: { type: object }
        sourceLineage: { type: object, additionalProperties: true }
        sampleDenominators: { type: object, additionalProperties: true }
        selectable: { type: boolean }
        selectionBlockReason: { type: ["string", "null"] }
      required: [candidateId, playerId, playerName, market, researchRank, researchState, lineupState, starterState, bvpEvidence, arsenalStatus, evidenceFreshness, primaryMechanism, opportunityEvidence, starterMatchupEvidence, bullpenPathEvidence, parkEvidence, counterEvidence, sourceLineage, sampleDenominators, selectable, selectionBlockReason]
    RoundRobinConstruction:
      type: object
      properties:
        constructionType: { type: string, enum: [TB_TB, TB_WALK, XBH_H_R_RBI, XBH_WALK] }
        constructionLabel: { type: string }
        side: { type: string, enum: [AWAY, HOME] }
        legs: { type: array, items: { $ref: "#/components/schemas/RoundRobinLeg" }, minItems: 2, maxItems: 2 }
        stateTotal: { type: integer }
        rankTotal: { type: integer }
        evidenceSummary: { type: string }
        legCases: { type: array, items: { type: object, additionalProperties: true } }
        sharedMechanism: { type: string }
        geometry: { type: ["string", "null"] }
        runnerUpComparison: { type: ["string", "null"] }
        rejectedAlternatives: { type: array, items: { type: string } }
        bullpenPathComplete:
          type: boolean
          description: |
            Whether both legs carry a complete, fresh, distinct projected
            7th/8th/9th bullpen path. A ranking input and a disclosure, never a
            veto: an incomplete path no longer removes a candidate from
            selection.
        bullpenCaveat: { type: ["string", "null"] }
        tieBroken:
          type: boolean
          description: True when this construction was chosen from an exactly tied set.
        tiedWith:
          type: array
          description: The constructions this one tied with on evidence, before the tiebreak.
          items: { type: string }
      required: [constructionType, constructionLabel, side, legs, stateTotal, rankTotal, evidenceSummary, legCases, sharedMechanism, geometry, runnerUpComparison, rejectedAlternatives, bullpenPathComplete, bullpenCaveat, tieBroken, tiedWith]
    RoundRobinSideComparison:
      type: object
      properties:
        side: { type: string, enum: [AWAY, HOME] }
        team: { type: string }
        evaluatedEligibleHitters: { type: integer, minimum: 0 }
        evaluatedIneligibleHitters: { type: integer, minimum: 0 }
        consideredConstructionTypes:
          type: array
          items: { type: string, enum: [TB_TB, TB_WALK, XBH_H_R_RBI, XBH_WALK] }
        bestConstruction: { anyOf: [{ $ref: "#/components/schemas/RoundRobinConstruction" }, { type: "null" }] }
        availabilityStatus: { type: string }
        availabilityDetail: { type: ["string", "null"] }
        unavailableReason: { type: ["string", "null"] }
        noPairCauses: { type: array, items: { type: string } }
        rejectedAlternatives: { type: array, items: { type: string } }
        bullpenDisclosures:
          type: array
          description: |
            Bullpen states on this side that are not a complete fresh path.
            Stated so the operator sees them; they never remove a candidate
            from selection.
          items: { type: string }
      required: [side, team, evaluatedEligibleHitters, evaluatedIneligibleHitters, consideredConstructionTypes, bestConstruction, availabilityStatus, availabilityDetail, unavailableReason, noPairCauses, rejectedAlternatives, bullpenDisclosures]

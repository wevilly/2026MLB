openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyst
    description: MLB Analyst Phase 1 read models
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyst/today:
    get:
      operationId: getAnalystToday
      tags: [analyst]
      summary: Get today's MLB slate and source state
      responses:
        "200":
          description: Today's analyst dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayDashboard"
  /analyst/projections:
    get:
      operationId: getAnalystProjections
      tags: [analyst]
      summary: Get FantasyPros projection snapshot summary
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Projection center data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionCenter"
  /analyst/data-health:
    get:
      operationId: getAnalystDataHealth
      tags: [analyst]
      summary: Get source freshness and data-quality state
      responses:
        "200":
          description: Data health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealth"
  /analyst/settings:
    get:
      operationId: getAnalystSettings
      tags: [analyst]
      summary: Get safe connection and preference metadata
      responses:
        "200":
          description: Safe settings metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalystSettings"
  /analyst/player-lab:
    get:
      operationId: getAnalystPlayerLab
      tags: [analyst]
      summary: Get canonical hitter research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Hitter research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
  /analyst/pitcher-lab:
    get:
      operationId: getAnalystPitcherLab
      tags: [analyst]
      summary: Get canonical pitcher research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Pitcher research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
  /analyst/game-lab:
    get:
      operationId: getAnalystGameLab
      tags: [analyst]
      summary: Get research-ready game and park context without a matchup score
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Game and park research preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLab"
  /analyst/refresh/mlb:
    post:
      operationId: refreshMlbOfficial
      tags: [analyst]
      summary: Run the official MLB schedule and starter ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/fantasypros:
    post:
      operationId: refreshFantasyPros
      tags: [analyst]
      summary: Run the server-side FantasyPros daily-state ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/research:
    post:
      operationId: refreshAnalystResearch
      tags: [analyst]
      summary: Retrieve and normalize public Statcast and FanGraphs research evidence
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Research ingest completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIngestResult"
  /analyst/refresh/research/splits-full:
    post:
      operationId: refreshFullUniverseStatcastSplits
      tags: [analyst]
      summary: Run one resumable batch of full-universe Statcast handedness split ingestion
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "202":
          description: A bounded full-universe Statcast split batch completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIngestSource"
  /analyst/market-research:
    get:
      operationId: getAnalystMarketResearch
      tags: [analyst]
      summary: Get market research candidates for a given date and market
      description: |
        Returns the market research candidate board for one or all markets on the given date.
        The board is populated by the Phase 3A–3D market engines; it is empty until at least
        one engine has completed a research pass.

        RANK, DON'T GATE rule: research_rank is an ordinal integer only. No state value
        removes a candidate from the board. The prohibitedFields array in the response
        documents which fields are permanently absent from this contract.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
          description: Filter to one market (TB=2+Total Bases, XBH=Extra Base Hit, WALK=Batter Walk, HR=Home Run)
        - name: gameId
          in: query
          required: false
          schema: { type: string }
          description: Filter to a specific game by game_pk
      responses:
        "200":
          description: Market research board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketResearch"
  /analyst/refresh/market-research/tb:
    post:
      operationId: refreshMarketResearchTB
      tags: [analyst]
      summary: Run the Total Bases (2+) research engine for a slate date
      description: |
        Executes the Phase 3A Total Bases research engine for all lineup candidates
        on the given slate date. Writes ranked candidates into the market_research_candidates
        table via the shared Phase 3 contract.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: TB engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TBEngineResult"
  /analyst/refresh/market-research/xbh:
    post:
      operationId: refreshMarketResearchXBH
      tags: [analyst]
      summary: Run the Extra Base Hit research engine for a slate date
      description: |
        Executes the Phase 3B Extra Base Hit research engine for all lineup candidates
        on the given slate date. Singles are explicitly excluded from all mechanism paths.
        Mechanisms: DOUBLE_ROUTE, TRIPLE_ROUTE, HOME_RUN_ROUTE, MULTI_PATH.
        Counter-evidence: WEAK_EXIT_VELOCITY, LOW_HARD_HIT_RATE, GROUND_BALL_HEAVY,
        PLATOON_DISADVANTAGE, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: XBH engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XBHEngineResult"
  /analyst/refresh/market-research/walk:
    post:
      operationId: refreshMarketResearchWALK
      tags: [analyst]
      summary: Run the Batter Walk research engine for a slate date
      description: |
        Executes the Phase 3C Batter Walk research engine for all lineup candidates
        on the given slate date. Walk research is driven by plate discipline and pitcher
        command — power metrics (SLG, ISO, barrel%) are explicitly absent.
        Mechanisms: PATIENCE_VS_COMMAND, COUNT_CREATION, BULLPEN_WALK_PATH.
        Counter-evidence: AGGRESSIVE_HITTER, PITCHER_LOW_WALK_RATE,
        FIRST_PITCH_STRIKE_HEAVY, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: WALK engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WALKEngineResult"
  /analyst/refresh/market-research/hr:
    post:
      operationId: refreshMarketResearchHR
      tags: [analyst]
      summary: Run the Home Run research engine for a slate date
      description: |
        Executes the Phase 3D Home Run research engine for all lineup candidates
        on the given slate date. PARK_ENVIRONMENT is a first-class primary mechanism —
        not context-only as in TB/XBH/WALK.
        Mechanisms: PULL_AIR, BARREL_POWER, PITCH_SHAPE_MISMATCH, PARK_ENVIRONMENT.
        Counter-evidence: LOW_BARREL_RATE, GROUND_BALL_DOMINANT, PITCHER_LOW_HR_RATE,
        NEUTRAL_PARK, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: HR engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HREngineResult"
  /analyst/bullpen-room:
    get:
      operationId: getAnalystBullpenRoom
      tags: [analyst]
      summary: Get bullpen availability board, leverage map, and D-1/D-2/D-3 usage for all 30 teams
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: team
          in: query
          required: false
          schema: { type: string }
          description: Filter to a single team by abbreviation (e.g. NYY)
      responses:
        "200":
          description: Bullpen room data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BullpenRoom"
  /analyst/refresh/bullpen:
    post:
      operationId: refreshBullpen
      tags: [analyst]
      summary: Ingest reliever appearances for the last 3 days and recompute availability and leverage maps
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Bullpen ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BullpenIngestResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SourceBadge:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        freshness: { type: string }
        lastSuccess: { type: ["string", "null"] }
        rowCount: { type: number }
        detail: { type: string }
      required: [name, status, freshness, lastSuccess, rowCount, detail]
    Starter:
      type: object
      properties:
        name: { type: string }
        hand: { type: string }
        state: { type: string }
        note: { type: string }
      required: [name, hand, state, note]
    SlateGame:
      type: object
      properties:
        id: { type: string }
        time: { type: string }
        away: { type: string }
        home: { type: string }
        park: { type: string }
        roof: { type: string }
        weather: { type: string }
        awayStarter: { $ref: "#/components/schemas/Starter" }
        homeStarter: { $ref: "#/components/schemas/Starter" }
        lineupState: { type: string }
        state: { type: string, enum: [READY, PARTIAL, BLOCKED] }
        flag: { type: ["string", "null"] }
      required: [id, time, away, home, park, roof, weather, awayStarter, homeStarter, lineupState, state, flag]
    TodayDashboard:
      type: object
      properties:
        date: { type: string }
        timezone: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        alerts: { type: array, items: { type: string } }
      required: [date, timezone, games, sources, identityCoverage, alerts]
    ProjectionRow:
      type: object
      properties:
        player: { type: string }
        team: { type: string }
        position: { type: string }
        market: { type: string }
        current: { type: ["number", "null"] }
        prior: { type: ["number", "null"] }
        asOf: { type: string }
        movement: { type: string }
      required: [player, team, position, market, current, prior, asOf, movement]
    ProjectionCenter:
      type: object
      properties:
        snapshotLabel: { type: string }
        effectiveDate: { type: string, format: date }
        snapshotIds: { type: array, items: { type: string } }
        uniqueEligibleHitters: { type: number }
        uniqueEligiblePitchers: { type: number }
        uniqueEligiblePlayers: { type: number }
        currentAsOf: { type: string }
        priorAsOf: { type: ["string", "null"] }
        rows: { type: array, items: { $ref: "#/components/schemas/ProjectionRow" } }
        systemNotes: { type: array, items: { type: string } }
      required: [snapshotLabel, effectiveDate, snapshotIds, uniqueEligibleHitters, uniqueEligiblePitchers, uniqueEligiblePlayers, currentAsOf, priorAsOf, rows, systemNotes]
    HealthIssue:
      type: object
      properties:
        label: { type: string }
        detail: { type: string }
        severity: { type: string }
      required: [label, detail, severity]
    IdentityCoverage:
      type: object
      properties:
        officialStartersMapped: { type: number }
        officialStartersTotal: { type: number }
        officialLineupPlayersMapped: { type: number }
        officialLineupPlayersTotal: { type: number }
        projectedLineupPlayersMapped: { type: number }
        projectedLineupPlayersTotal: { type: number }
        activeProjectionPlayersMapped: { type: number }
        activeProjectionPlayersTotal: { type: number }
        unresolvedActivePlayers: { type: number }
        quarantinedRows: { type: number }
        teamAssignmentConflicts: { type: number }
        blockingProjectedLineupIssues: { type: number }
      required:
        - officialStartersMapped
        - officialStartersTotal
        - officialLineupPlayersMapped
        - officialLineupPlayersTotal
        - projectedLineupPlayersMapped
        - projectedLineupPlayersTotal
        - activeProjectionPlayersMapped
        - activeProjectionPlayersTotal
        - unresolvedActivePlayers
        - quarantinedRows
        - teamAssignmentConflicts
        - blockingProjectedLineupIssues
    DataHealth:
      type: object
      properties:
        overall: { type: string }
        phase2aReady: { type: boolean }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        issues: { type: array, items: { $ref: "#/components/schemas/HealthIssue" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        researchHealth: { $ref: "#/components/schemas/ResearchHealth" }
        lastRun: { type: string }
      required: [overall, phase2aReady, sources, issues, identityCoverage, researchHealth, lastRun]
    ConnectionStatus:
      type: object
      properties:
        name: { type: string }
        configured: { type: boolean }
        detail: { type: string }
      required: [name, configured, detail]
    AnalystSettings:
      type: object
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/ConnectionStatus" } }
        timezone: { type: string }
        defaultMarket: { type: string }
        refreshCadence: { type: string }
      required: [connections, timezone, defaultMarket, refreshCadence]
    IngestResult:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount]
    ResearchIngestSource:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
        status: { type: string, enum: [SUCCESS, PARTIAL, FAILED] }
        error: { type: ["string", "null"] }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount, status, error]
    ResearchHealth:
      type: object
      properties:
        playerProfiles: { type: number }
        pitcherProfiles: { type: number }
        arsenalProfiles: { type: number }
        parkProfiles: { type: number }
        identityQuarantines: { type: number }
        insufficientSamples: { type: number }
        missingArsenal: { type: number }
        missingHandednessSplits: { type: number }
        metricDefinitionConflicts: { type: number }
        staleWindows: { type: number }
        eligibleHitterProfiles: { type: number }
        eligiblePitcherProfiles: { type: number }
        hitterProfilesMissingEvidence: { type: number }
        pitcherProfilesMissingEvidence: { type: number }
        noMlbSample: { type: number }
        sourceThresholdOrUnavailable: { type: number }
        identityOrEligibilityGaps: { type: number }
        roleGaps: { type: number }
        handednessCoverageScope: { type: string, enum: [FULL_ELIGIBLE_HITTER_AND_PITCHER_UNIVERSE] }
        handednessIngestStatus: { type: string, enum: [RUNNING, SUCCESS, PARTIAL, FAILED, NOT_RUN] }
        handednessTargetPlayers: { type: number }
        handednessCoveredPlayers: { type: number }
        parkRequiredVenues: { type: number }
        parkVenueCoverageGaps: { type: number }
      required: [playerProfiles, pitcherProfiles, arsenalProfiles, parkProfiles, identityQuarantines, insufficientSamples, missingArsenal, missingHandednessSplits, metricDefinitionConflicts, staleWindows, eligibleHitterProfiles, eligiblePitcherProfiles, hitterProfilesMissingEvidence, pitcherProfilesMissingEvidence, noMlbSample, sourceThresholdOrUnavailable, identityOrEligibilityGaps, roleGaps, handednessCoverageScope, handednessIngestStatus, handednessTargetPlayers, handednessCoveredPlayers, parkRequiredVenues, parkVenueCoverageGaps]
    ResearchMetric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["number", "null"] }
        unit: { type: string }
        denominator: { type: ["number", "null"] }
        sampleSize: { type: ["number", "null"] }
        source: { type: string }
        definition: { type: string }
        transformation: { type: string, enum: [RAW, NORMALIZED, DERIVED, DERIVED_FROM_STATCAST, HEURISTIC] }
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_SAMPLE, NOT_FOUND, QUARANTINED] }
        retrievedAt: { type: string }
      required: [key, label, value, unit, denominator, sampleSize, source, definition, transformation, status, retrievedAt]
    ResearchPanel:
      type: object
      properties:
        title: { type: string }
        metrics: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [title, metrics]
    ResearchIdentity:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        bats: { type: string }
        throws: { type: string }
        position: { type: string }
        rosterState: { type: string }
      required: [playerId, name, team, bats, throws, position, rosterState]
    ResearchProfile:
      type: object
      properties:
        identity: { $ref: "#/components/schemas/ResearchIdentity" }
        window: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: string }
        freshness: { type: string }
        role: { type: string }
        panels: { type: array, items: { $ref: "#/components/schemas/ResearchPanel" } }
        arsenal: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
        notes: { type: array, items: { type: string } }
      required: [identity, window, effectiveFrom, effectiveTo, freshness, role, panels, arsenal, notes]
    ResearchSearchResult:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        role: { type: string }
      required: [playerId, name, team, position, role]
    ResearchLab:
      type: object
      properties:
        sourceStatus: { type: string }
        searchResults: { type: array, items: { $ref: "#/components/schemas/ResearchSearchResult" } }
        profile: { anyOf: [{ $ref: "#/components/schemas/ResearchProfile" }, { type: "null" }] }
        notices: { type: array, items: { type: string } }
      required: [sourceStatus, searchResults, profile, notices]
    ParkResearch:
      type: object
      properties:
        venue: { type: string }
        span: { type: string }
        factors: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [venue, span, factors]
    GameLab:
      type: object
      properties:
        date: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        selectedGame: { anyOf: [{ $ref: "#/components/schemas/SlateGame" }, { type: "null" }] }
        parkResearch: { anyOf: [{ $ref: "#/components/schemas/ParkResearch" }, { type: "null" }] }
        notes: { type: array, items: { type: string } }
      required: [date, games, selectedGame, parkResearch, notes]
    ResearchIngestResult:
      type: object
      properties:
        status: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/ResearchIngestSource" } }
        quarantinedRows: { type: number }
        notes: { type: array, items: { type: string } }
      required: [status, sources, quarantinedRows, notes]
    BullpenLeverageMap:
      type: object
      properties:
        projected9th: { type: ["integer", "null"] }
        projected8th: { type: ["integer", "null"] }
        projected7th: { type: ["integer", "null"] }
        highestLeverageLefty: { type: ["integer", "null"] }
        longMan: { type: ["integer", "null"] }
        highestWalkReliever: { type: ["integer", "null"] }
        lowestWalkReliever: { type: ["integer", "null"] }
        roleUncertainty: { type: boolean }
        notes: { type: ["string", "null"] }
        computedAt: { type: ["string", "null"] }
      required: [projected9th, projected8th, projected7th, highestLeverageLefty, longMan, highestWalkReliever, lowestWalkReliever, roleUncertainty, notes, computedAt]
    BullpenArm:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        throws: { type: string }
        role: { type: string }
        availability: { type: string, enum: [AVAILABLE, LIKELY_AVAILABLE, DOUBTFUL, OUT, UNKNOWN, STALE] }
        confidence: { type: string, enum: [HEURISTIC, MANAGER_OVERRIDE, UNKNOWN] }
        d1Pitches: { type: ["integer", "null"] }
        d2Pitches: { type: ["integer", "null"] }
        d3Pitches: { type: ["integer", "null"] }
        consecutiveDays: { type: integer }
        multiInningYesterday: { type: boolean }
        daysSinceLastUse: { type: ["integer", "null"] }
        managerOverride: { type: ["string", "null"] }
        managerOverrideNote: { type: ["string", "null"] }
        staleBadge: { type: boolean }
        sourceFreshness: { type: ["string", "null"] }
        computedAt: { type: ["string", "null"] }
      required: [playerId, name, throws, role, availability, confidence, d1Pitches, d2Pitches, d3Pitches, consecutiveDays, multiInningYesterday, daysSinceLastUse, managerOverride, managerOverrideNote, staleBadge, sourceFreshness, computedAt]
    BullpenUsageEntry:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        pitches: { type: integer }
        ip: { type: string }
        multiInning: { type: boolean }
      required: [playerId, name, pitches, ip, multiInning]
    BullpenUsage:
      type: object
      properties:
        d1: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
        d2: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
        d3: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
      required: [d1, d2, d3]
    BullpenTeam:
      type: object
      properties:
        teamId: { type: integer }
        abbreviation: { type: string }
        name: { type: string }
        slateDate: { type: string }
        leverageMap: { $ref: "#/components/schemas/BullpenLeverageMap" }
        arms: { type: array, items: { $ref: "#/components/schemas/BullpenArm" } }
        usage: { $ref: "#/components/schemas/BullpenUsage" }
        coveragePercentage: { type: number }
        staleBadge: { type: boolean }
        computedAt: { type: ["string", "null"] }
      required: [teamId, abbreviation, name, slateDate, leverageMap, arms, usage, coveragePercentage, staleBadge, computedAt]
    BullpenRoomSummary:
      type: object
      properties:
        teamsWithData: { type: integer }
        teamsStale: { type: integer }
        totalArms: { type: integer }
        armsAvailable: { type: integer }
        armsLikelyAvailable: { type: integer }
        armsDoubtful: { type: integer }
        armsOut: { type: integer }
        armsUnknown: { type: integer }
      required: [teamsWithData, teamsStale, totalArms, armsAvailable, armsLikelyAvailable, armsDoubtful, armsOut, armsUnknown]
    BullpenRoom:
      type: object
      properties:
        date: { type: string }
        requestedTeam: { type: ["string", "null"] }
        staleFreshnessWindowSeconds: { type: integer }
        teams: { type: array, items: { $ref: "#/components/schemas/BullpenTeam" } }
        summary: { $ref: "#/components/schemas/BullpenRoomSummary" }
      required: [date, requestedTeam, staleFreshnessWindowSeconds, teams, summary]
    BullpenIngestResult:
      type: object
      properties:
        source: { type: string }
        slateDate: { type: string }
        gamesProcessed: { type: integer }
        appearancesNormalized: { type: integer }
        appearancesRejected: { type: integer }
        teamsComputed: { type: integer }
        error: { type: ["string", "null"] }
      required: [source, slateDate, gamesProcessed, appearancesNormalized, appearancesRejected, teamsComputed, error]
    TBEngineResult:
      type: object
      description: |
        Result of a Total Bases (2+) research engine run.
        RANK_DONT_GATE: produces ordinal research_rank only.
        No odds, EV, CLV, or implied probability is produced.
      properties:
        market: { type: string }
        slateDate: { type: string, format: date }
        gamesProcessed: { type: integer }
        candidatesProcessed: { type: integer }
        candidatesWritten: { type: integer }
        blockedCandidates: { type: integer }
        strongCandidates: { type: integer }
        positiveCandidates: { type: integer }
        neutralCandidates: { type: integer }
        negativeCandidates: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [market, slateDate, gamesProcessed, candidatesProcessed, candidatesWritten, blockedCandidates, strongCandidates, positiveCandidates, neutralCandidates, negativeCandidates, processingMs, notes, error]
    XBHEngineResult:
      type: object
      description: |
        Result of an Extra Base Hit research engine run.
        RANK_DONT_GATE: produces ordinal research_rank only.
        No odds, EV, CLV, or implied probability is produced.
        Singles are explicitly excluded from all mechanism paths.
      properties:
        market: { type: string }
        slateDate: { type: string, format: date }
        gamesProcessed: { type: integer }
        candidatesProcessed: { type: integer }
        candidatesWritten: { type: integer }
        blockedCandidates: { type: integer }
        strongCandidates: { type: integer }
        positiveCandidates: { type: integer }
        neutralCandidates: { type: integer }
        negativeCandidates: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [market, slateDate, gamesProcessed, candidatesProcessed, candidatesWritten, blockedCandidates, strongCandidates, positiveCandidates, neutralCandidates, negativeCandidates, processingMs, notes, error]
    WALKEngineResult:
      type: object
      description: |
        Result of a Batter Walk research engine run.
        RANK_DONT_GATE: produces ordinal research_rank only.
        No odds, EV, CLV, or implied probability is produced.
        Walk research is discipline-driven — power metrics are explicitly absent.
      properties:
        market: { type: string }
        slateDate: { type: string, format: date }
        gamesProcessed: { type: integer }
        candidatesProcessed: { type: integer }
        candidatesWritten: { type: integer }
        blockedCandidates: { type: integer }
        strongCandidates: { type: integer }
        positiveCandidates: { type: integer }
        neutralCandidates: { type: integer }
        negativeCandidates: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [market, slateDate, gamesProcessed, candidatesProcessed, candidatesWritten, blockedCandidates, strongCandidates, positiveCandidates, neutralCandidates, negativeCandidates, processingMs, notes, error]
    HREngineResult:
      type: object
      description: |
        Result of a Home Run research engine run.
        RANK_DONT_GATE: produces ordinal research_rank only.
        No odds, EV, CLV, or implied probability is produced.
        PARK_ENVIRONMENT is a first-class primary mechanism — not context-only.
      properties:
        market: { type: string }
        slateDate: { type: string, format: date }
        gamesProcessed: { type: integer }
        candidatesProcessed: { type: integer }
        candidatesWritten: { type: integer }
        blockedCandidates: { type: integer }
        strongCandidates: { type: integer }
        positiveCandidates: { type: integer }
        neutralCandidates: { type: integer }
        negativeCandidates: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [market, slateDate, gamesProcessed, candidatesProcessed, candidatesWritten, blockedCandidates, strongCandidates, positiveCandidates, neutralCandidates, negativeCandidates, processingMs, notes, error]
    MarketResearchCandidate:
      type: object
      description: |
        One research candidate for a player-market-slate_date-game combination.
        RANK_DONT_GATE: research_rank is ordinal only; it implies no threshold, gate, or probability.
        Ties share the same integer rank and are never collapsed.
        Prohibited fields absent from this schema: ev, clv, odds, impliedProbability, vigJuice,
        edgePercent, kellyFraction, expectedValue.
      properties:
        candidateId: { type: string }
        slateDate: { type: string, format: date }
        gamePk: { type: integer }
        playerId: { type: integer }
        playerName: { type: string }
        market: { type: string, enum: [TB, XBH, WALK, HR] }
        researchRank: { type: ["integer", "null"] }
        researchState: { type: string, enum: [STRONG, POSITIVE, NEUTRAL, NEGATIVE, BLOCKED] }
        primaryMechanism: { type: ["string", "null"] }
        secondaryMechanism: { type: ["string", "null"] }
        opportunityEvidence: { type: object }
        starterMatchupEvidence: { type: object }
        bullpenPathEvidence: { type: object }
        parkEvidence: { type: object }
        recentVsSeasonVsCareer: { type: object }
        counterEvidence: { type: object }
        missingStaleEvidence: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [candidateId, slateDate, gamePk, playerId, playerName, market, researchRank, researchState, primaryMechanism, secondaryMechanism, opportunityEvidence, starterMatchupEvidence, bullpenPathEvidence, parkEvidence, recentVsSeasonVsCareer, counterEvidence, missingStaleEvidence, createdAt, updatedAt]
    MarketResearch:
      type: object
      description: |
        Market research board for a given date/market/game.
        Populated by Phase 3A–3D engines. Empty until at least one engine has run.
        The prohibitedFields array documents which analytics are permanently absent from this contract.
      properties:
        date: { type: string, format: date }
        market: { type: ["string", "null"] }
        gameId: { type: ["string", "null"] }
        rankSemantics: { type: string }
        prohibitedFields: { type: array, items: { type: string } }
        candidates: { type: array, items: { $ref: "#/components/schemas/MarketResearchCandidate" } }
        candidateCount: { type: integer }
        systemNote: { type: string }
      required: [date, market, gameId, rankSemantics, prohibitedFields, candidates, candidateCount, systemNote]


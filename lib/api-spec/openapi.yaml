        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiResearchDraftReviewInput" }
      responses:
        "200":
          description: Draft rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiResearchDraftReviewResult" }
        "400":
          description: Invalid or prohibited review action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyst
    description: MLB Analyst Phase 1 read models
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyst/today:
    get:
      operationId: getAnalystToday
      tags: [analyst]
      summary: Get today's MLB slate and source state
      parameters:
        - name: date
          in: query
          required: false
          description: Requested MLB slate date in Eastern Time. Defaults to the current Eastern date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Today's analyst dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayDashboard"
  /analyst/projections:
    get:
      operationId: getAnalystProjections
      tags: [analyst]
      summary: Get FantasyPros projection snapshot summary
      parameters:
        - name: date
          in: query
          required: false
          description: Requested MLB slate date in Eastern Time. Defaults to the current Eastern date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Projection center data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionCenter"
  /analyst/data-health:
    get:
      operationId: getAnalystDataHealth
      tags: [analyst]
      summary: Get source freshness and data-quality state
      parameters:
        - name: date
          in: query
          required: false
          description: Requested MLB slate date in Eastern Time. Defaults to the current Eastern date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Data health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealth"
  /analyst/orchestration/runs:
    get:
      operationId: getAnalystOrchestrationRuns
      tags: [analyst]
      summary: List daily orchestration runs
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Orchestration history and schedule policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestrationRunList" }
  /analyst/orchestration/run:
    post:
      operationId: startAnalystOrchestrationRun
      tags: [analyst]
      summary: Start a manual daily orchestration run
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestrationRun" }
  /analyst/orchestration/runs/{runId}/interrupt:
    post:
      operationId: interruptAnalystOrchestrationRun
      tags: [analyst]
      summary: Request safe interruption of an active run
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated run record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestrationRun" }
  /analyst/orchestration/late-scratches:
    post:
      operationId: detectAnalystLateScratches
      tags: [analyst]
      summary: Record post-freeze lineup scratches as immutable corrections
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "201":
          description: Late-scratch detection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LateScratchDetection" }
  /analyst/settlements/automate:
    post:
      operationId: automateAnalystSettlement
      tags: [analyst]
      summary: Settle a completed slate and create missing postmortems
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "201":
          description: Official settlement automation result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /analyst/export/slate-json:
    get:
      operationId: exportAnalystSlateJson
      tags: [analyst]
      summary: Export platform state as slate JSON
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Derived slate export; platform remains official record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlateExport" }
  /analyst/export/workbook:
    get:
      operationId: exportAnalystWorkbook
      tags: [analyst]
      summary: Export the compatibility workbook
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Excel-compatible derived workbook
          content:
            application/vnd.ms-excel:
              schema: { type: string, format: binary }
  /analyst/export/round-robin/workbook:
    get:
      operationId: exportAnalystRoundRobinWorkbook
      tags: [analyst]
      summary: Export the Round Robin comparison boards as an Excel workbook
      description: |
        Derived output. One .xlsx carrying the same comparison the JSON surface
        returns: the selected construction per game, every leg with its evidence,
        both sides including the one that lost the comparison, and the ties,
        no-pair causes and bullpen disclosures as their own columns.

        Omit board to export RR1 through RR5 in one workbook. Excludes odds,
        price, EV, CLV, vig and probabilities, exactly as the comparison does.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: board
          in: query
          required: false
          schema: { type: string, enum: [RR1, RR2, RR3, RR4, RR5] }
      responses:
        "200":
          description: Round Robin workbook, one sheet per surface
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /analyst/audit-events:
    get:
      operationId: getAnalystAuditEvents
      tags: [analyst]
      summary: List append-only operational audit events
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
  /analyst/settings:
    get:
      operationId: getAnalystSettings
      tags: [analyst]
      summary: Get safe connection and preference metadata
      responses:
        "200":
          description: Safe settings metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalystSettings"
  /analyst/player-lab:
    get:
      operationId: getAnalystPlayerLab
      tags: [analyst]
      summary: Get canonical hitter research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Hitter research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
        "400":
          description: Invalid player search request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Research service failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/pitcher-lab:
    get:
      operationId: getAnalystPitcherLab
      tags: [analyst]
      summary: Get canonical pitcher research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Pitcher research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
        "400":
          description: Invalid pitcher search request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Research service failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/batter-pitcher:
    get:
      operationId: getAnalystBatterPitcher
      tags: [analyst]
      summary: Get canonical-ID named batter-versus-pitcher evidence as bounded secondary context
      parameters:
        - name: batterId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: pitcherId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR], default: TB }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Named-pair evidence, including visible unavailable and thin-sample states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatterPitcherEvidence"
  /analyst/refresh/batter-pitcher:
    post:
      operationId: refreshAnalystBatterPitcher
      tags: [analyst]
      summary: Refresh current official-slate canonical batter-versus-pitcher evidence
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Named-pair source refresh completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatterPitcherRefresh"
  /analyst/game-lab:
    get:
      operationId: getAnalystGameLab
      tags: [analyst]
      summary: Get research-ready game and park context without a matchup score
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Game and park research preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLab"
  /analyst/refresh/mlb:
    post:
      operationId: refreshMlbOfficial
      tags: [analyst]
      summary: Run the official MLB schedule and starter ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/fantasypros:
    post:
      operationId: refreshFantasyPros
      tags: [analyst]
      summary: Run the server-side FantasyPros daily-state ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/weather:
    post:
      operationId: refreshWeather
      tags: [analyst]
      summary: Retry optional Open-Meteo weather enrichment for one Eastern MLB slate date
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Weather refresh completed or partially completed without running orchestration or model work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherRefreshResult"
        "400":
          description: Invalid slate date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Weather refresh failed; the persisted result includes failure detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherRefreshResult"
  /analyst/refresh/research:
    post:
      operationId: refreshAnalystResearch
      tags: [analyst]
      summary: Retrieve and normalize public Statcast and FanGraphs research evidence
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Research ingest completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIngestResult"
  /analyst/refresh/research/splits-full:
    post:
      operationId: refreshFullUniverseStatcastSplits
      tags: [analyst]
      summary: Run one resumable batch of full-universe Statcast handedness split ingestion
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "202":
          description: A bounded full-universe Statcast split batch completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIngestSource"
  /analyst/refresh/historical-intelligence:
    post:
      operationId: refreshHistoricalIntelligence
      tags: [analyst]
      summary: Materialize bounded historical player intelligence from retained source events
      description: |
        This background-safe operation writes immutable game-context and player-event
        records from already retained canonical-ID source observations, then derives
        denominator-aware hitter profile features. It never runs in the daily slate
        critical path and does not claim coverage for games the configured sources
        have not retained.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a prior partial materialization response.
          schema: { type: string }
      responses:
        "202":
          description: One bounded historical-intelligence materialization completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalIntelligenceRefresh"
        "400":
          description: Invalid historical materialization request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/historical-intelligence/coverage:
    get:
      operationId: getHistoricalIntelligenceCoverage
      tags: [analyst]
      summary: Get retained historical player-intelligence coverage
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Retained event, context, and derived profile coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalIntelligenceCoverage"
  /analyst/market-research:
    get:
      operationId: getAnalystMarketResearch
      tags: [analyst]
      summary: Get market research candidates for a given date and market
      description: |
        Returns the market research candidate board for one or all markets on the given date.
        The board is populated by the Phase 3A–3D market engines; it is empty until at least
        one engine has completed a research pass.

        RANK, DON'T GATE rule: research_rank is an ordinal integer only. No state value
        removes a candidate from the board. The prohibitedFields array in the response
        documents which fields are permanently absent from this contract.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
          description: Filter to one market (TB=2+Total Bases, XBH=Extra Base Hit, WALK=Batter Walk, HR=Home Run)
        - name: gameId
          in: query
          required: false
          schema: { type: string }
          description: Filter to a specific game by game_pk
      responses:
        "200":
          description: Market research board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketResearch"
  /analyst/round-robin/comparison:
    get:
      operationId: getAnalystRoundRobinComparison
      tags: [analyst]
      summary: Compare away and home Round Robin constructions for every game
      description: |
        Evaluates both teams' eligible projected or posted hitters before choosing
        a legal research construction. The comparison is source-backed only and
        permanently excludes odds, price, EV, CLV, vig, and probabilities.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: board
          in: query
          required: true
          schema: { type: string, enum: [RR1, RR2, RR3, RR4, RR5] }
      responses:
        "200":
          description: Both-team game construction comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinComparison"
  /analyst/refresh/market-research/tb:
    post:
      operationId: refreshMarketResearchTB
      tags: [analyst]
      summary: Run the Total Bases (2+) research engine for a slate date
      description: |
        Executes the Phase 3A Total Bases research engine for all lineup candidates
        on the given slate date. Writes ranked candidates into the market_research_candidates
        table via the shared Phase 3 contract.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: TB engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TBEngineResult"
  /analyst/refresh/market-research/xbh:
    post:
      operationId: refreshMarketResearchXBH
      tags: [analyst]
      summary: Run the Extra Base Hit research engine for a slate date
      description: |
        Executes the Phase 3B Extra Base Hit research engine for all lineup candidates
        on the given slate date. Singles are explicitly excluded from all mechanism paths.
        Mechanisms: DOUBLE_ROUTE, TRIPLE_ROUTE, HOME_RUN_ROUTE, MULTI_PATH.
        Counter-evidence: WEAK_EXIT_VELOCITY, LOW_HARD_HIT_RATE, GROUND_BALL_HEAVY,
        PLATOON_DISADVANTAGE, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: XBH engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XBHEngineResult"
  /analyst/refresh/market-research/walk:
    post:
      operationId: refreshMarketResearchWALK
      tags: [analyst]
      summary: Run the Batter Walk research engine for a slate date
      description: |
        Executes the Phase 3C Batter Walk research engine for all lineup candidates
        on the given slate date. Walk research is driven by plate discipline and pitcher
        command — power metrics (SLG, ISO, barrel%) are explicitly absent.
        Mechanisms: PATIENCE_VS_COMMAND, COUNT_CREATION, BULLPEN_WALK_PATH.
        Counter-evidence: AGGRESSIVE_HITTER, PITCHER_LOW_WALK_RATE,
        FIRST_PITCH_STRIKE_HEAVY, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: WALK engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WALKEngineResult"
  /analyst/refresh/market-research/hr:
    post:
      operationId: refreshMarketResearchHR
      tags: [analyst]
      summary: Run the Home Run research engine for a slate date
      description: |
        Executes the Phase 3D Home Run research engine for all lineup candidates
        on the given slate date. PARK_ENVIRONMENT is a first-class primary mechanism —
        not context-only as in TB/XBH/WALK.
        Mechanisms: PULL_AIR, BARREL_POWER, PITCH_SHAPE_MISMATCH, PARK_ENVIRONMENT.
        Counter-evidence: LOW_BARREL_RATE, GROUND_BALL_DOMINANT, PITCHER_LOW_HR_RATE,
        NEUTRAL_PARK, INSUFFICIENT_SAMPLE.

        RANK, DON'T GATE: produces ordinal research_rank only; no odds, EV, CLV, or
        implied probability is computed or stored. Idempotent — re-running overwrites
        prior results for the same slate date.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Slate date to run (defaults to today)
      responses:
        "201":
          description: HR engine run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HREngineResult"
  /analyst/feature-store:
    get:
      operationId: getAnalystFeatureStore
      tags: [analyst]
      summary: Query pregame feature snapshot history
      description: |
        Returns immutable pregame feature snapshots for the given filters.
        Each snapshot was captured at slate-freeze time and can never be mutated.
        Corrections create new rows with a correction_of FK and a required taxonomy reason.

        Process-error taxonomy codes: LATE_SCRATCH, LINEUP_ERROR, DATA_INGEST_FAILURE,
        IDENTITY_ERROR, SOURCE_UNAVAILABLE, HUMAN_CORRECTION.

        PROHIBITED: No odds, EV, CLV, implied probability, or sportsbook data is stored.
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Feature store query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureStoreResult"
  /analyst/feature-store/capture:
    post:
      operationId: captureFeatureStoreSlate
      tags: [analyst]
      summary: Capture pregame feature snapshots for a slate date
      description: |
        Captures immutable pregame feature snapshots for all market research candidates
        on the given slate date. Run this after all four market engines have completed.
        Idempotent — identical feature hashes are skipped without error.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Slate capture completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureStoreCaptureResult"
  /analyst/feature-store/backfill:
    post:
      operationId: backfillFeatureStore
      tags: [analyst]
      summary: Backfill feature snapshots from historical market research candidates
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Backfill completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureStoreBackfillResult"
  /analyst/feature-store/correct:
    post:
      operationId: correctFeatureStoreSnapshot
      tags: [analyst]
      summary: Create a correction snapshot pointing to an original
      description: |
        Creates a new snapshot row that supersedes the original. The original row is NEVER
        modified — immutability is preserved. correctionReason MUST be one of the six
        process-error taxonomy codes (LATE_SCRATCH, LINEUP_ERROR, DATA_INGEST_FAILURE,
        IDENTITY_ERROR, SOURCE_UNAVAILABLE, HUMAN_CORRECTION). Supplying any other value
        is rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureSnapshotCorrectionInput"
      responses:
        "201":
          description: Correction snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureStoreCorrectionResult"
        "400":
          description: Invalid correction reason or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
        "404":
          description: Original snapshot not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/feature-store/outcome:
    post:
      operationId: writeFeatureStoreOutcome
      tags: [analyst]
      summary: Append an official historical outcome for a player-game-market
      description: |
        Writes one append-only outcome row to historical_outcomes. No UPDATE or DELETE
        is ever issued — each call creates a new row with a distinct outcomeId. This endpoint
        creates a PENDING official-stat observation only; it cannot create a settled result.
        SETTLED rows are created exclusively by the MLB Stats API settlement workflow.
        sourceId must be MLB_OFFICIAL.
        Do NOT supply odds, EV, CLV, or sportsbook data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalOutcomeInput"
      responses:
        "201":
          description: Outcome row written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteHistoricalOutcomeResult"
        "400":
          description: Missing required fields or invalid market code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/settlement/refresh:
    post:
      operationId: refreshOfficialSettlement
      tags: [analyst]
      summary: Settle completed games from the official MLB Stats API
      description: |
        Reads final MLB game feeds and appends official TB, XBH, walk, and home-run
        outcomes. FantasyPros and other projection sources are never accepted for settlement.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "201":
          description: Official settlement refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialSettlementRefreshResult"
        "400":
          description: Invalid settlement date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/settlements/ingest:
    post:
      operationId: ingestOfficialSettlements
      tags: [analyst]
      summary: Ingest official MLB settlements for a date
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "201":
          description: Official settlement refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialSettlementRefreshResult"
        "400":
          description: Invalid settlement date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/settlements/{gamePk}:
    post:
      operationId: settleOfficialGame
      tags: [analyst]
      summary: Settle one completed game from MLB Stats API
      parameters:
        - name: gamePk
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Official game settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialGameSettlementResult"
        "400":
          description: Invalid game or non-official settlement request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/settlements:
    get:
      operationId: getAnalystSettlements
      tags: [analyst]
      summary: List immutable official settlement outcomes
      parameters:
        - name: gamePk
          in: query
          schema: { type: integer, minimum: 1 }
        - name: playerId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: market
          in: query
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Official settlement rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementList"
  /analyst/postmortems:
    post:
      operationId: createAnalystPostmortem
      tags: [analyst]
      summary: Create an immutable postmortem for a settled market outcome
      description: |
        Links one frozen pregame feature snapshot to its matching SETTLED official
        outcome. The request has no odds, price, probability, EV, CLV, sportsbook,
        or arbitrary metadata fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketPostmortemInput"
      responses:
        "201":
          description: Immutable postmortem created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPostmortem"
        "400":
          description: Invalid linkage or unsettled outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
    get:
      operationId: getAnalystPostmortems
      tags: [analyst]
      summary: List immutable market postmortems
      parameters:
        - name: playerId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: market
          in: query
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "200":
          description: Market postmortem rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostmortemList"
  /analyst/models/train:
    post:
      operationId: trainAnalystModel
      tags: [analyst]
      summary: Train one independent market model
      description: |
        Trains a deterministic, market-specific candidate from frozen pregame feature
        snapshots joined only to current official MLB settled outcomes. The artifact is
        stored in private App Storage and pinned by content hash. Training does not
        publish predictions to the market board or activate the model.
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "201":
          description: Candidate model training completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelTrainingResult"
        "400":
          description: Invalid market or no official settled training rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/models:
    get:
      operationId: getAnalystModels
      tags: [analyst]
      summary: List versioned market model candidates
      parameters:
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "200":
          description: Model versions and lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelVersionList"
        "400":
          description: Invalid market
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/models/{versionId}/promote:
    post:
      operationId: promoteAnalystModel
      tags: [analyst]
      summary: Promote one validated candidate model to ACTIVE
      description: |
        Operator-initiated promotion. Refuses unless the version is a CANDIDATE with a
        walk-forward acceptance whose run passed, met the expected calibration error
        threshold, met the sharpness guard, beat its benchmark by the required margin,
        and carries accepted calibration parameters. Retires whatever was ACTIVE for the
        same market in the same transaction, so exactly one model per market is live.
        Promotion is never performed by the orchestration pipeline.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The version is now ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPromotionResult"
        "400":
          description: The version does not meet the promotion conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPromotionRefusal"
        "404":
          description: The version was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPromotionRefusal"
  /analyst/models/{versionId}/demote:
    post:
      operationId: demoteAnalystModel
      tags: [analyst]
      summary: Return one market to research-only
      description: |
        The kill switch. Retires the ACTIVE model for its market, so the next board
        refresh emits RESEARCH_ONLY rows for that market.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDemotionInput"
      responses:
        "200":
          description: The version is retired and the market is research-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDemotionResult"
        "400":
          description: The version is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPromotionRefusal"
        "404":
          description: The version was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPromotionRefusal"
  /analyst/models/validate:
    post:
      operationId: validateAnalystModel
      tags: [analyst]
      summary: Run chronological walk-forward validation for a model version
      description: |
        Evaluates a model using only frozen snapshots and official settled outcomes
        dated before each fold's test date. The run compares out-of-sample Brier skill
        with a market-specific historical base-rate benchmark and performs fold-local
        Platt calibration. A PASS run is required before ACTIVE.
      parameters:
        - name: modelVersionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Walk-forward validation completed or recorded as incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkForwardValidationResult"
        "400":
          description: Invalid or unavailable model version
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/models/validation:
    get:
      operationId: getAnalystModelValidation
      tags: [analyst]
      summary: List walk-forward validation history
      parameters:
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "200":
          description: Walk-forward validation runs by market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkForwardValidationList"
        "400":
          description: Invalid market
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/market-board/refresh:
    post:
      operationId: refreshAnalystDailyMarketBoard
      tags: [analyst]
      summary: Materialize the independent daily research board
      description: |
        Resolves current research candidates to corrected frozen pregame snapshots,
        materializes independent research ranks and retains FantasyPros values as
        reference-only lineage. It does not train, promote, or present models,
        calibrated probabilities, confidence labels, or recommendations.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR, H_R_RBI] }
      responses:
        "201":
          description: Daily board population completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMarketBoardRefreshResult"
        "400":
          description: Invalid date or market
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/market-board:
    get:
      operationId: getAnalystDailyMarketBoard
      tags: [analyst]
      summary: Get independent daily market research rows
      description: |
        Returns independently ranked research rows with optional FantasyPros
        comparison ranks, evidence readiness, and PASS/BLOCKED conclusions.
        No model prediction, confidence, probability, or betting fields are
        presented.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR, H_R_RBI] }
      responses:
        "200":
          description: Persisted daily market board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMarketBoard"
        "400":
          description: Invalid date or market
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /analyst/market-board/game-summary:
    get:
      operationId: getAnalystDailyBoardGameSummary
      tags: [analyst]
      summary: Get game-level context for persisted board candidates
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Starters, bullpen availability counts, and top confidence candidate by market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBoardGameSummary"
  /analyst/bettor/sources:
    get:
      operationId: getAnalystBettorSources
      tags: [analyst]
      summary: List tracked bettor source identities
      description: |
        Sources remain independent at the platform-account level. When an
        operator has determined that accounts belong to the same person, the
        optional person-level identity key is returned for lineage auditing.
      responses:
        "200":
          description: Bettor source identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorSourceList"
    post:
      operationId: createAnalystBettorSource
      tags: [analyst]
      summary: Create or update a bettor platform-account identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BettorSourceInput"
      responses:
        "201":
          description: Bettor source stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorSource"
        "400":
          description: Invalid source payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/bettor/sources/{sourceId}:
    patch:
      operationId: updateAnalystBettorSource
      tags: [analyst]
      summary: Update a bettor source identity
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BettorSourceUpdateInput"
      responses:
        "200":
          description: Bettor source updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorSource"
        "400":
          description: Invalid update or unknown source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A different source already uses the platform account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteAnalystBettorSource
      tags: [analyst]
      summary: Delete a source with no historical picks
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Source deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorSourceDeleteResult"
        "400":
          description: Unknown source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Historical source cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/bettor/ingest:
    post:
      operationId: ingestAnalystBettorPick
      tags: [analyst]
      summary: Ingest one structured bettor pick and its evidence lineage
      description: |
        Accepts baseball research evidence only. mechanismTags must be drawn
        from the approved Phase 3 vocabulary. The endpoint does not accept
        odds, prices, EV, CLV, popularity, or vote counts. Source text is
        retained only when it fits the bounded reasoning limit; otherwise the
        persisted field is a marked paraphrase. AI writers are blocked at the
        database layer from writing source, pick, or lineage rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BettorPickIngestInput"
      responses:
        "201":
          description: Bettor pick and any duplication lineage stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorPickIngestResult"
        "400":
          description: Invalid pick payload, mechanism vocabulary, or source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Source already has a pick for the player-market-date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/bettor/picks:
    get:
      operationId: getAnalystBettorPicks
      tags: [analyst]
      summary: Get bettor picks and duplication lineage flags
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "200":
          description: Structured bettor picks with source and copy lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorPickList"
        "400":
          description: Invalid date or market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/bettor/evaluation:
    get:
      operationId: getAnalystBettorEvaluation
      tags: [analyst]
      summary: Evaluate bettor performance against settled official outcomes
      description: |
        Returns persisted source performance by market and approved mechanism,
        plus settled pick history. Likely copied picks receive reduced weight
        in outcome and independence calculations. This observational output is
        isolated from model training and daily confidence labels.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [TB, XBH, WALK, HR] }
      responses:
        "200":
          description: Bettor evaluation records and settled pick history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorEvaluation"
        "400":
          description: Invalid source ID or market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/ai/tool-registry:
    get:
      operationId: getAnalystAiToolRegistry
      tags: [analyst]
      summary: List the documented read-only tools available to the AI Analyst
      responses:
        "200":
          description: Active and inactive AI tool registry entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiToolRegistry" }
  /analyst/ai/tool-call:
    post:
      operationId: callAnalystAiTool
      tags: [analyst]
      summary: Execute one audited read-only AI Analyst tool call
      description: |
        The gateway accepts only active READ_ONLY registry tools. Unknown tool
        names and any attempted write operation are rejected and logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiToolCallInput" }
      responses:
        "200":
          description: Read-only tool result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiToolCallResult" }
        "400":
          description: Invalid input or prohibited tool operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiToolCallResult" }
        "502":
          description: A permitted live research provider failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiToolCallResult" }
  /analyst/ai/chat:
    post:
      operationId: chatWithAnalystAi
      tags: [analyst]
      summary: Ask the AI Analyst a tool-grounded research question
      description: The AI can only summarize the audited read-only tool result returned for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalystChatInput" }
      responses:
        "200":
          description: Tool-grounded AI response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalystChatResult" }
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: AI or permitted research provider failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/ai/drafts:

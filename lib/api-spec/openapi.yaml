        newestSlateDate: { type: ["string", "null"] }
        distinctSlateDates: { type: integer }
        totalOutcomes: { type: integer }
        outcomesByMarket: { type: object }
      required: [totalSnapshots, originalSnapshots, correctionSnapshots, snapshotsByMarket, oldestSlateDate, newestSlateDate, distinctSlateDates, totalOutcomes, outcomesByMarket]
    PregameFeatureSnapshot:
      type: object
      description: |
        Immutable pregame feature snapshot for one player-market-game-date.
        NEVER updated after capture. Corrections create new rows with correction_of FK.
        correctionTaxonomy codes: LATE_SCRATCH, LINEUP_ERROR, DATA_INGEST_FAILURE,
        IDENTITY_ERROR, SOURCE_UNAVAILABLE, HUMAN_CORRECTION.
        PROHIBITED: No odds, EV, CLV, or sportsbook data.
      properties:
        snapshotId: { type: string }
        playerId: { type: integer }
        playerName: { type: string }
        gamePk: { type: integer }
        slateDate: { type: string }
        market: { type: string, enum: [TB, XBH, WALK, HR] }
        frozenAt: { type: string }
        researchRank: { type: ["integer", "null"] }
        researchState: { type: ["string", "null"] }
        primaryMechanism: { type: ["string", "null"] }
        features: { type: object }
        correctionOf: { type: ["string", "null"] }
        correctionReason: { type: ["string", "null"] }
        correctionNote: { type: ["string", "null"] }
        isCorrection: { type: boolean }
        createdAt: { type: string }
      required: [snapshotId, playerId, playerName, gamePk, slateDate, market, frozenAt, researchRank, researchState, primaryMechanism, features, correctionOf, correctionReason, correctionNote, isCorrection, createdAt]
    FeatureStoreResult:
      type: object
      properties:
        snapshots: { type: array, items: { $ref: "#/components/schemas/PregameFeatureSnapshot" } }
        total: { type: integer }
        stats: { $ref: "#/components/schemas/FeatureStoreStats" }
        filters: { type: object }
        correctionTaxonomy: { type: array, items: { type: string } }
        systemNote: { type: string }
      required: [snapshots, total, stats, filters, correctionTaxonomy, systemNote]
    FeatureStoreCaptureResult:
      type: object
      properties:
        slateDate: { type: string }
        ingestRunId: { type: string }
        markets: { type: array, items: { type: string } }
        candidatesFound: { type: integer }
        snapshotsWritten: { type: integer }
        snapshotsSkipped: { type: integer }
        snapshotErrors: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [slateDate, ingestRunId, markets, candidatesFound, snapshotsWritten, snapshotsSkipped, snapshotErrors, processingMs, notes, error]
    FeatureStoreBackfillResult:
      type: object
      properties:
        fromDate: { type: string }
        toDate: { type: string }
        datesProcessed: { type: integer }
        candidatesFound: { type: integer }
        snapshotsWritten: { type: integer }
        snapshotsSkipped: { type: integer }
        processingMs: { type: integer }
        notes: { type: array, items: { type: string } }
        error: { type: ["string", "null"] }
      required: [fromDate, toDate, datesProcessed, candidatesFound, snapshotsWritten, snapshotsSkipped, processingMs, notes, error]
    FeatureSnapshotCorrectionInput:
      type: object
      additionalProperties: false
      description: |
        Request body for POST /analyst/feature-store/correct.
        correctionReason must be one of the six process-error taxonomy codes.
        Supplying any other value is rejected with 400. No odds, EV, CLV,
        implied probability, sportsbook, or other betting-derived data may be
        supplied. The server recursively validates replacement feature vectors
        before creating an immutable correction row.
      properties:
        snapshotId:
          type: string
          description: UUID of the original snapshot to correct.
        correctionReason:
          type: string
          enum: [LATE_SCRATCH, LINEUP_ERROR, DATA_INGEST_FAILURE, IDENTITY_ERROR, SOURCE_UNAVAILABLE, HUMAN_CORRECTION]
          description: Required taxonomy code — must match one of the six approved codes exactly.
        correctionNote:
          type: ["string", "null"]
          description: Optional free-text explanation of the correction.
        updatedFeatures:
          anyOf:
            - $ref: "#/components/schemas/FeatureStoreFeatureVector"
            - type: "null"
          description: Complete replacement feature vector. If null, the original features are copied into the correction row.
      required: [snapshotId, correctionReason]
    FeatureStoreFeatureVector:
      type: object
      additionalProperties: false
      description: |
        Complete pregame feature vector. This schema intentionally contains
        baseball research evidence only. Prohibited betting-derived keys and
        values (odds, EV, CLV, implied probability, sportsbook, etc.) are
        rejected recursively by the server before persistence.
      required:
        - market
        - slateDate
        - playerId
        - gamePk
        - candidateId
        - researchRank
        - researchState
        - primaryMechanism
        - secondaryMechanism
        - opportunityEvidence
        - starterMatchupEvidence
        - bullpenPathEvidence
        - parkEvidence
        - recentVsSeasonVsCareer
        - counterEvidence
        - hitterFeatures
        - pitcherFeatures
        - parkFeatures
      properties:
        market: { type: string, enum: [TB, XBH, WALK, HR] }
        slateDate: { type: string, format: date }
        playerId: { type: integer, minimum: 1 }
        gamePk: { type: integer, minimum: 1 }
        candidateId: { type: string, minLength: 1 }
        researchRank: { type: ["number", "null"] }
        researchState: { type: ["string", "null"] }
        primaryMechanism: { type: ["string", "null"] }
        secondaryMechanism: { type: ["string", "null"] }
        opportunityEvidence: { type: object, additionalProperties: true }
        starterMatchupEvidence: { type: object, additionalProperties: true }
        bullpenPathEvidence: { type: object, additionalProperties: true }
        parkEvidence: { type: object, additionalProperties: true }
        recentVsSeasonVsCareer: { type: object, additionalProperties: true }
        counterEvidence: { type: object, additionalProperties: true }
        hitterFeatures:
          type: object
          additionalProperties: { type: ["number", "null"] }
        pitcherFeatures:
          type: object
          additionalProperties: { type: ["number", "null"] }
        parkFeatures:
          type: object
          additionalProperties: { type: ["number", "null"] }
    HistoricalOutcomeInput:
      type: object
      additionalProperties: false
      description: |
        Request body for POST /analyst/feature-store/outcome.
        Appends one immutable outcome row to historical_outcomes.
        No UPDATE or DELETE is issued — each call creates a distinct row.
        This request accepts only official baseball-stat fields. Arbitrary raw
        payloads and all odds, EV, CLV, implied probability, sportsbook, or
        other betting-derived fields are rejected with 400.
      properties:
        playerId: { type: integer }
        gamePk: { type: integer }
        slateDate: { type: string, format: date }
        market: { type: string, enum: [TB, XBH, WALK, HR] }
        singles: { type: integer, minimum: 0 }
        doubles: { type: integer, minimum: 0 }
        triples: { type: integer, minimum: 0 }
        homeRuns: { type: integer, minimum: 0 }
        walks: { type: integer, minimum: 0 }
        plateAppearances: { type: integer, minimum: 0 }
        atBats: { type: integer, minimum: 0 }
        sourceId: { type: string, description: "Must reference an existing source_registry entry (e.g. MLB_OFFICIAL)." }
        ingestRunId: { type: ["string", "null"] }
      required: [playerId, gamePk, slateDate, market, sourceId]
    WriteHistoricalOutcomeResult:
      type: object
      properties:
        outcomeId: { type: string }
        outcomeValue: { type: number }
        outcomeHit: { type: boolean }
      required: [outcomeId, outcomeValue, outcomeHit]
    UnsettleableBoardCandidate:
      type: object
      properties:
        playerId: { type: integer }
        market: { type: string }
        reason: { type: string }
        gamePk: { type: integer }
      required: [playerId, market, reason]
    SettlementReconciliation:
      type: object
      description: |
        Every board candidate either settled or appears by name in unsettleable
        with the reason it did not. Settlement previously iterated only frozen
        feature snapshots, so a candidate that reached the board without a
        snapshot was never settled and vanished from the record silently.
      properties:
        boardCandidates: { type: integer, minimum: 0 }
        settled: { type: integer, minimum: 0 }
        settledWithoutSnapshot:
          type: integer
          minimum: 0
          description: |
            Settled from the board with no frozen snapshot. A complete
            operational settle record, deliberately excluded from model
            training because it has no pregame feature vector.
        unsettleable:
          type: array
          items: { $ref: "#/components/schemas/UnsettleableBoardCandidate" }
        totalBasesDiscrepancies:
          type: array
          description: |
            Rows where the total bases computed from the components and the
            total bases the feed reported disagree. Settled DISPUTED rather
            than silently taking one of the two.
          items: { type: string }
        walkDefinition:
          type: string
          description: The walk definition applied to this settlement, e.g. BB+IBB (assumed).
        walkDefinitionAssumed: { type: boolean }
        walkDefinitionStatement: { type: string }
      required: [boardCandidates, settled, settledWithoutSnapshot, unsettleable, totalBasesDiscrepancies, walkDefinition, walkDefinitionAssumed, walkDefinitionStatement]
    OfficialGameSettlementResult:
      type: object
      properties:
        gamePk: { type: integer, minimum: 1 }
        slateDate: { type: string, format: date }
        ingestRunId: { type: string }
        state: { type: string, enum: [PENDING, SETTLED, POSTPONED, NO_ACTION, DISPUTED] }
        lines: { type: integer, minimum: 0 }
        outcomesWritten: { type: integer, minimum: 0 }
        corrections: { type: integer, minimum: 0 }
        reconciliation: { $ref: "#/components/schemas/SettlementReconciliation" }
      required: [gamePk, slateDate, ingestRunId, state, lines, outcomesWritten, corrections]
    OfficialSettlementRefreshResult:
      type: object

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyst
    description: MLB Analyst Phase 1 read models
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyst/today:
    get:
      operationId: getAnalystToday
      tags: [analyst]
      summary: Get today's MLB slate and source state
      responses:
        "200":
          description: Today's analyst dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayDashboard"
  /analyst/projections:
    get:
      operationId: getAnalystProjections
      tags: [analyst]
      summary: Get FantasyPros projection snapshot summary
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Projection center data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionCenter"
  /analyst/data-health:
    get:
      operationId: getAnalystDataHealth
      tags: [analyst]
      summary: Get source freshness and data-quality state
      responses:
        "200":
          description: Data health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealth"
  /analyst/settings:
    get:
      operationId: getAnalystSettings
      tags: [analyst]
      summary: Get safe connection and preference metadata
      responses:
        "200":
          description: Safe settings metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalystSettings"
  /analyst/player-lab:
    get:
      operationId: getAnalystPlayerLab
      tags: [analyst]
      summary: Get canonical hitter research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Hitter research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
  /analyst/pitcher-lab:
    get:
      operationId: getAnalystPitcherLab
      tags: [analyst]
      summary: Get canonical pitcher research profile
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [SEASON, CAREER, ROLLING_7, ROLLING_14, ROLLING_30, ROLLING_60] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Pitcher research profile and canonical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchLab"
  /analyst/game-lab:
    get:
      operationId: getAnalystGameLab
      tags: [analyst]
      summary: Get research-ready game and park context without a matchup score
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Game and park research preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLab"
  /analyst/refresh/mlb:
    post:
      operationId: refreshMlbOfficial
      tags: [analyst]
      summary: Run the official MLB schedule and starter ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/fantasypros:
    post:
      operationId: refreshFantasyPros
      tags: [analyst]
      summary: Run the server-side FantasyPros daily-state ingest
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
  /analyst/refresh/research:
    post:
      operationId: refreshAnalystResearch
      tags: [analyst]
      summary: Retrieve and normalize public Statcast and FanGraphs research evidence
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Research ingest completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIngestResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SourceBadge:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        freshness: { type: string }
        lastSuccess: { type: ["string", "null"] }
        rowCount: { type: number }
        detail: { type: string }
      required: [name, status, freshness, lastSuccess, rowCount, detail]
    Starter:
      type: object
      properties:
        name: { type: string }
        hand: { type: string }
        state: { type: string }
        note: { type: string }
      required: [name, hand, state, note]
    SlateGame:
      type: object
      properties:
        id: { type: string }
        time: { type: string }
        away: { type: string }
        home: { type: string }
        park: { type: string }
        roof: { type: string }
        weather: { type: string }
        awayStarter: { $ref: "#/components/schemas/Starter" }
        homeStarter: { $ref: "#/components/schemas/Starter" }
        lineupState: { type: string }
        state: { type: string, enum: [READY, PARTIAL, BLOCKED] }
        flag: { type: ["string", "null"] }
      required: [id, time, away, home, park, roof, weather, awayStarter, homeStarter, lineupState, state, flag]
    TodayDashboard:
      type: object
      properties:
        date: { type: string }
        timezone: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        alerts: { type: array, items: { type: string } }
      required: [date, timezone, games, sources, identityCoverage, alerts]
    ProjectionRow:
      type: object
      properties:
        player: { type: string }
        team: { type: string }
        position: { type: string }
        market: { type: string }
        current: { type: ["number", "null"] }
        prior: { type: ["number", "null"] }
        asOf: { type: string }
        movement: { type: string }
      required: [player, team, position, market, current, prior, asOf, movement]
    ProjectionCenter:
      type: object
      properties:
        snapshotLabel: { type: string }
        effectiveDate: { type: string, format: date }
        snapshotIds: { type: array, items: { type: string } }
        uniqueEligibleHitters: { type: number }
        uniqueEligiblePitchers: { type: number }
        uniqueEligiblePlayers: { type: number }
        currentAsOf: { type: string }
        priorAsOf: { type: ["string", "null"] }
        rows: { type: array, items: { $ref: "#/components/schemas/ProjectionRow" } }
        systemNotes: { type: array, items: { type: string } }
      required: [snapshotLabel, effectiveDate, snapshotIds, uniqueEligibleHitters, uniqueEligiblePitchers, uniqueEligiblePlayers, currentAsOf, priorAsOf, rows, systemNotes]
    HealthIssue:
      type: object
      properties:
        label: { type: string }
        detail: { type: string }
        severity: { type: string }
      required: [label, detail, severity]
    IdentityCoverage:
      type: object
      properties:
        officialStartersMapped: { type: number }
        officialStartersTotal: { type: number }
        officialLineupPlayersMapped: { type: number }
        officialLineupPlayersTotal: { type: number }
        projectedLineupPlayersMapped: { type: number }
        projectedLineupPlayersTotal: { type: number }
        activeProjectionPlayersMapped: { type: number }
        activeProjectionPlayersTotal: { type: number }
        unresolvedActivePlayers: { type: number }
        quarantinedRows: { type: number }
        teamAssignmentConflicts: { type: number }
        blockingProjectedLineupIssues: { type: number }
      required:
        - officialStartersMapped
        - officialStartersTotal
        - officialLineupPlayersMapped
        - officialLineupPlayersTotal
        - projectedLineupPlayersMapped
        - projectedLineupPlayersTotal
        - activeProjectionPlayersMapped
        - activeProjectionPlayersTotal
        - unresolvedActivePlayers
        - quarantinedRows
        - teamAssignmentConflicts
        - blockingProjectedLineupIssues
    DataHealth:
      type: object
      properties:
        overall: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        issues: { type: array, items: { $ref: "#/components/schemas/HealthIssue" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        researchHealth: { $ref: "#/components/schemas/ResearchHealth" }
        lastRun: { type: string }
      required: [overall, sources, issues, identityCoverage, researchHealth, lastRun]
    ConnectionStatus:
      type: object
      properties:
        name: { type: string }
        configured: { type: boolean }
        detail: { type: string }
      required: [name, configured, detail]
    AnalystSettings:
      type: object
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/ConnectionStatus" } }
        timezone: { type: string }
        defaultMarket: { type: string }
        refreshCadence: { type: string }
      required: [connections, timezone, defaultMarket, refreshCadence]
    IngestResult:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount]
    ResearchIngestSource:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
        status: { type: string, enum: [SUCCESS, PARTIAL, FAILED] }
        error: { type: ["string", "null"] }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount, status, error]
    ResearchHealth:
      type: object
      properties:
        playerProfiles: { type: number }
        pitcherProfiles: { type: number }
        arsenalProfiles: { type: number }
        parkProfiles: { type: number }
        identityQuarantines: { type: number }
        insufficientSamples: { type: number }
        missingArsenal: { type: number }
        missingHandednessSplits: { type: number }
        metricDefinitionConflicts: { type: number }
        staleWindows: { type: number }
        eligibleHitterProfiles: { type: number }
        eligiblePitcherProfiles: { type: number }
        hitterProfilesMissingEvidence: { type: number }
        pitcherProfilesMissingEvidence: { type: number }
        noMlbSample: { type: number }
        sourceThresholdOrUnavailable: { type: number }
        identityOrEligibilityGaps: { type: number }
        roleGaps: { type: number }
      required: [playerProfiles, pitcherProfiles, arsenalProfiles, parkProfiles, identityQuarantines, insufficientSamples, missingArsenal, missingHandednessSplits, metricDefinitionConflicts, staleWindows, eligibleHitterProfiles, eligiblePitcherProfiles, hitterProfilesMissingEvidence, pitcherProfilesMissingEvidence, noMlbSample, sourceThresholdOrUnavailable, identityOrEligibilityGaps, roleGaps]
    ResearchMetric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["number", "null"] }
        unit: { type: string }
        denominator: { type: ["number", "null"] }
        sampleSize: { type: ["number", "null"] }
        source: { type: string }
        definition: { type: string }
        transformation: { type: string, enum: [RAW, NORMALIZED, DERIVED, DERIVED_FROM_STATCAST, HEURISTIC] }
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_SAMPLE, NOT_FOUND, QUARANTINED] }
        retrievedAt: { type: string }
      required: [key, label, value, unit, denominator, sampleSize, source, definition, transformation, status, retrievedAt]
    ResearchPanel:
      type: object
      properties:
        title: { type: string }
        metrics: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [title, metrics]
    ResearchIdentity:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        bats: { type: string }
        throws: { type: string }
        position: { type: string }
        rosterState: { type: string }
      required: [playerId, name, team, bats, throws, position, rosterState]
    ResearchProfile:
      type: object
      properties:
        identity: { $ref: "#/components/schemas/ResearchIdentity" }
        window: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: string }
        freshness: { type: string }
        role: { type: string }
        panels: { type: array, items: { $ref: "#/components/schemas/ResearchPanel" } }
        arsenal: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
        notes: { type: array, items: { type: string } }
      required: [identity, window, effectiveFrom, effectiveTo, freshness, role, panels, arsenal, notes]
    ResearchSearchResult:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        role: { type: string }
      required: [playerId, name, team, position, role]
    ResearchLab:
      type: object
      properties:
        sourceStatus: { type: string }
        searchResults: { type: array, items: { $ref: "#/components/schemas/ResearchSearchResult" } }
        profile: { anyOf: [{ $ref: "#/components/schemas/ResearchProfile" }, { type: "null" }] }
        notices: { type: array, items: { type: string } }
      required: [sourceStatus, searchResults, profile, notices]
    ParkResearch:
      type: object
      properties:
        venue: { type: string }
        span: { type: string }
        factors: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [venue, span, factors]
    GameLab:
      type: object
      properties:
        date: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        selectedGame: { anyOf: [{ $ref: "#/components/schemas/SlateGame" }, { type: "null" }] }
        parkResearch: { anyOf: [{ $ref: "#/components/schemas/ParkResearch" }, { type: "null" }] }
        notes: { type: array, items: { type: string } }
      required: [date, games, selectedGame, parkResearch, notes]
    ResearchIngestResult:
      type: object
      properties:
        status: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/ResearchIngestSource" } }
        quarantinedRows: { type: number }
        notes: { type: array, items: { type: string } }
      required: [status, sources, quarantinedRows, notes]


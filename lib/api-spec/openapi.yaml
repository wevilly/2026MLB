        source: { type: string, enum: [MLB Official] }
        slateDate: { type: string, format: date }
        gamesFound: { type: integer, minimum: 0 }
        gamesSettled: { type: integer, minimum: 0 }
        outcomesWritten: { type: integer, minimum: 0 }
        corrections: { type: integer, minimum: 0 }
        reconciliation: { $ref: "#/components/schemas/SettlementReconciliation" }
        games:
          type: array
          items: { $ref: "#/components/schemas/OfficialGameSettlementResult" }
      required: [source, slateDate, gamesFound, gamesSettled, outcomesWritten, corrections, reconciliation, games]

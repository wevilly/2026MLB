          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiResearchDraft" }
        "400":
          description: Invalid draft input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/ai/drafts/{draftId}/approve:

      operationId: approveAnalystAiDraft
      tags: [analyst]
      summary: Human-review and approve an AI research draft
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiResearchDraftReviewInput" }
      responses:
        "200":
          description: Draft approved and copied to separate approved-note record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiResearchDraftReviewResult" }
        "400":
          description: Invalid or prohibited review action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analyst/ai/drafts/{draftId}/reject:

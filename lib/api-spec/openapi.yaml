    get:
      operationId: getAnalystAiResearchNotes
      tags: [analyst]
      summary: List human-approved AI-sourced research notes
      parameters:
        - name: sessionId
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
        - name: playerId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Approved AI-sourced notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNoteList" }
  /analyst/bullpen-room:
    get:
      operationId: getAnalystBullpenRoom
      tags: [analyst]
      summary: Get bullpen availability board, leverage map, and D-1/D-2/D-3 usage for all 30 teams
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: team
          in: query
          required: false
          schema: { type: string }
          description: Filter to a single team by abbreviation (e.g. NYY)
      responses:
        "200":
          description: Bullpen room data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BullpenRoom"
  /analyst/refresh/bullpen:
    post:
      operationId: refreshBullpen
      tags: [analyst]
      summary: Ingest reliever appearances for the last 3 days and recompute availability and leverage maps
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "201":
          description: Bullpen ingest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BullpenIngestResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SourceBadge:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        freshness: { type: string }
        lastSuccess: { type: ["string", "null"] }
        rowCount: { type: number }
        detail: { type: string }
        effectiveDate: { type: ["string", "null"] }
        ageMinutes: { type: ["integer", "null"], minimum: 0 }
        isCurrentDate: { type: boolean }
      required: [name, status, freshness, lastSuccess, rowCount, detail, effectiveDate, ageMinutes, isCurrentDate]
    OperationalReadiness:
      type: object
      additionalProperties: false
      properties:
        currentDate: { type: string }
        requestedDate: { type: string }
        isCurrentDate: { type: boolean }
        status: { type: string, enum: [READY, PARTIAL, BLOCKED, AUDIT_ONLY] }
        usable: { type: boolean }
        reason: { type: string }
        reasons: { type: array, items: { type: string } }
        observedAt: { type: string, format: date-time }
      required: [currentDate, requestedDate, isCurrentDate, status, usable, reason, reasons, observedAt]
    Starter:
      type: object
      properties:
        name: { type: string }
        hand: { type: string }
        state: { type: string }
        note: { type: string }
      required: [name, hand, state, note]
    SlateGame:
      type: object
      properties:
        id: { type: string }
        time: { type: string }
        away: { type: string }
        home: { type: string }
        park: { type: string }
        roof: { type: string }
        weather: { type: string }
        awayStarter: { $ref: "#/components/schemas/Starter" }
        homeStarter: { $ref: "#/components/schemas/Starter" }
        lineupState: { type: string }
        state: { type: string, enum: [READY, PARTIAL, BLOCKED] }
        flag: { type: ["string", "null"] }
      required: [id, time, away, home, park, roof, weather, awayStarter, homeStarter, lineupState, state, flag]
    TodayDashboard:
      type: object
      properties:
        date: { type: string }
        timezone: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        readiness: { $ref: "#/components/schemas/OperationalReadiness" }
        alerts: { type: array, items: { type: string } }
      required: [date, timezone, games, sources, identityCoverage, readiness, alerts]
    ProjectionRow:
      type: object
      properties:
        player: { type: string }
        team: { type: string }
        position: { type: string }
        market: { type: string }
        current: { type: ["number", "null"] }
        prior: { type: ["number", "null"] }
        asOf: { type: string }
        movement: { type: string }
      required: [player, team, position, market, current, prior, asOf, movement]
    ProjectionCenter:
      type: object
      properties:
        snapshotLabel: { type: string }
        effectiveDate: { type: string, format: date }
        snapshotIds: { type: array, items: { type: string } }
        uniqueEligibleHitters: { type: number }
        uniqueEligiblePitchers: { type: number }
        uniqueEligiblePlayers: { type: number }
        currentAsOf: { type: string }
        priorAsOf: { type: ["string", "null"] }
        rows: { type: array, items: { $ref: "#/components/schemas/ProjectionRow" } }
        systemNotes: { type: array, items: { type: string } }
      required: [snapshotLabel, effectiveDate, snapshotIds, uniqueEligibleHitters, uniqueEligiblePitchers, uniqueEligiblePlayers, currentAsOf, priorAsOf, rows, systemNotes]
    HealthIssue:
      type: object
      properties:
        label: { type: string }
        detail: { type: string }
        severity: { type: string }
      required: [label, detail, severity]
    IdentityCoverage:
      type: object
      properties:
        officialStartersMapped: { type: number }
        officialStartersTotal: { type: number }
        officialLineupPlayersMapped: { type: number }
        officialLineupPlayersTotal: { type: number }
        projectedLineupPlayersMapped: { type: number }
        projectedLineupPlayersTotal: { type: number }
        activeProjectionPlayersMapped: { type: number }
        activeProjectionPlayersTotal: { type: number }
        unresolvedActivePlayers: { type: number }
        quarantinedRows: { type: number }
        teamAssignmentConflicts: { type: number }
        blockingProjectedLineupIssues: { type: number }
      required:
        - officialStartersMapped
        - officialStartersTotal
        - officialLineupPlayersMapped
        - officialLineupPlayersTotal
        - projectedLineupPlayersMapped
        - projectedLineupPlayersTotal
        - activeProjectionPlayersMapped
        - activeProjectionPlayersTotal
        - unresolvedActivePlayers
        - quarantinedRows
        - teamAssignmentConflicts
        - blockingProjectedLineupIssues
    DataHealth:
      type: object
      properties:
        selectedDate: { type: string }
        timezone: { type: string }
        slateState: { type: string, enum: [NO_INGEST_RUN, FAILED_SOURCE, EMPTY_OFFICIAL_SLATE, MISSING_DOWNSTREAM_STAGE, POPULATED] }
        overall: { type: string }
        phase2aReady: { type: boolean }
        readinessDiagnostics: { type: array, items: { $ref: "#/components/schemas/ReadinessDiagnostic" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceBadge" } }
        issues: { type: array, items: { $ref: "#/components/schemas/HealthIssue" } }
        identityCoverage: { $ref: "#/components/schemas/IdentityCoverage" }
        researchHealth: { $ref: "#/components/schemas/ResearchHealth" }
        lastRun: { type: string }
        readiness: { $ref: "#/components/schemas/OperationalReadiness" }
        weatherRefresh:
          type: ["object", "null"]
          properties:
            ingestRunId: { type: string, format: uuid }
            status: { type: string, enum: [SUCCESS, PARTIAL, FAILED, RUNNING] }
            slateDate: { type: string, format: date }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: ["string", "null"], format: date-time }
            gamesFound: { type: integer, minimum: 0 }
            observationsWritten: { type: integer, minimum: 0 }
            failures: { type: integer, minimum: 0 }
            error: { type: ["string", "null"] }
          required: [ingestRunId, status, slateDate, startedAt, finishedAt, gamesFound, observationsWritten, failures, error]
      required: [selectedDate, timezone, slateState, overall, phase2aReady, readinessDiagnostics, sources, issues, identityCoverage, researchHealth, lastRun, readiness, weatherRefresh]
    ReadinessDiagnostic:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        status: { type: string, enum: [READY, BLOCKED] }
        detail: { type: string }
      required: [code, label, status, detail]
    ConnectionStatus:
      type: object
      properties:
        name: { type: string }
        configured: { type: boolean }
        detail: { type: string }
      required: [name, configured, detail]
    AnalystSettings:
      type: object
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/ConnectionStatus" } }
        timezone: { type: string }
        defaultMarket: { type: string }
        refreshCadence: { type: string }
      required: [connections, timezone, defaultMarket, refreshCadence]
    IngestResult:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount]
    WeatherIngestFailure:
      type: object
      additionalProperties: false
      properties:
        scope: { type: string }
        detail: { type: string }
        fatal: { type: boolean }
      required: [scope, detail, fatal]
    WeatherRefreshResult:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [SUCCESS, PARTIAL, FAILED] }
        slateDate: { type: string, format: date }
        ingestRunId: { type: ["string", "null"], format: uuid }
        gamesFound: { type: integer, minimum: 0 }
        observationsWritten: { type: integer, minimum: 0 }
        domedGames: { type: integer, minimum: 0 }
        gamesWithoutGeography: { type: integer, minimum: 0 }
        failures:
          type: array
          items: { $ref: "#/components/schemas/WeatherIngestFailure" }
        error: { type: string }
      required: [status, slateDate, ingestRunId, gamesFound, observationsWritten, domedGames, gamesWithoutGeography, failures]
    ResearchIngestSource:
      type: object
      properties:
        source: { type: string }
        ingestRunId: { type: string }
        rowCount: { type: number }
        normalizedRowCount: { type: number }
        rejectedRowCount: { type: number }
        status: { type: string, enum: [SUCCESS, PARTIAL, FAILED] }
        error: { type: ["string", "null"] }
      required: [source, ingestRunId, rowCount, normalizedRowCount, rejectedRowCount, status, error]
    HistoricalIntelligenceRefresh:
      type: object
      description: Bounded background materialization status. Coverage is limited to retained canonical-ID source events.
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [READY, PARTIAL, NOT_FOUND, BLOCKED] }
        requestedFrom: { type: string, format: date }
        requestedTo: { type: string, format: date }
        nextCursor: { type: ["string", "null"] }
        sourceRows: { type: integer, minimum: 0 }
        contextsWritten: { type: integer, minimum: 0 }
        observationsWritten: { type: integer, minimum: 0 }
        featuresWritten: { type: integer, minimum: 0 }
        notes: { type: array, items: { type: string } }
      required: [runId, status, requestedFrom, requestedTo, nextCursor, sourceRows, contextsWritten, observationsWritten, featuresWritten, notes]
    HistoricalIntelligenceCoverage:
      type: object
      properties:
        status: { type: string, enum: [READY, PARTIAL, NOT_FOUND, BLOCKED] }
        playerId: { type: ["integer", "null"] }
        firstObservationDate: { type: ["string", "null"], format: date }
        latestObservationDate: { type: ["string", "null"], format: date }
        eventCount: { type: integer, minimum: 0 }
        contextCount: { type: integer, minimum: 0 }
        derivedFeatureCount: { type: integer, minimum: 0 }
        latestDerivedAt: { type: ["string", "null"], format: date-time }
        notes: { type: array, items: { type: string } }
      required: [status, playerId, firstObservationDate, latestObservationDate, eventCount, contextCount, derivedFeatureCount, latestDerivedAt, notes]
    ResearchHealth:
      type: object
      properties:
        playerProfiles: { type: number }
        pitcherProfiles: { type: number }
        arsenalProfiles: { type: number }
        parkProfiles: { type: number }
        identityQuarantines: { type: number }
        insufficientSamples: { type: number }
        missingArsenal: { type: number }
        missingHandednessSplits: { type: number }
        metricDefinitionConflicts: { type: number }
        staleWindows: { type: number }
        eligibleHitterProfiles: { type: number }
        eligiblePitcherProfiles: { type: number }
        hitterProfilesMissingEvidence: { type: number }
        pitcherProfilesMissingEvidence: { type: number }
        noMlbSample: { type: number }
        sourceThresholdOrUnavailable: { type: number }
        identityOrEligibilityGaps: { type: number }
        roleGaps: { type: number }
        handednessCoverageScope: { type: string, enum: [FULL_ELIGIBLE_HITTER_AND_PITCHER_UNIVERSE] }
        handednessIngestStatus: { type: string, enum: [RUNNING, SUCCESS, PARTIAL, FAILED, NOT_RUN] }
        handednessTargetPlayers: { type: number }
        handednessCoveredPlayers: { type: number }
        parkRequiredVenues: { type: number }
        parkVenueCoverageGaps: { type: number }
        # Audit S1. The platoon layer reads players.bats for the hitter and
        # players.throws for the pitcher. Both were being overwritten with an
        # empty string, which is not null: it reads as a recorded value, so a
        # switch hitter resolves to no side and every split metric falls back
        # to the unsplit season line with nothing reporting it. These counters
        # are how that becomes visible, and they are the population rate the
        # remediation plan asked for and could not answer from code.
        handednessPopulationScope: { type: string, enum: [TODAY_LINEUP_HITTERS_AND_SLATE_STARTERS] }
        lineupHitters: { type: number }
        lineupHittersMissingBats: { type: number }
        slateStarters: { type: number }
        slateStartersMissingThrows: { type: number }
        playersTotal: { type: number }
        playersMissingThrows: { type: number }
        playersMissingBats: { type: number }
      required: [playerProfiles, pitcherProfiles, arsenalProfiles, parkProfiles, identityQuarantines, insufficientSamples, missingArsenal, missingHandednessSplits, metricDefinitionConflicts, staleWindows, eligibleHitterProfiles, eligiblePitcherProfiles, hitterProfilesMissingEvidence, pitcherProfilesMissingEvidence, noMlbSample, sourceThresholdOrUnavailable, identityOrEligibilityGaps, roleGaps, handednessCoverageScope, handednessIngestStatus, handednessTargetPlayers, handednessCoveredPlayers, parkRequiredVenues, parkVenueCoverageGaps, handednessPopulationScope, lineupHitters, lineupHittersMissingBats, slateStarters, slateStartersMissingThrows, playersTotal, playersMissingThrows, playersMissingBats]
    ResearchMetric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["number", "null"] }
        unit: { type: string }
        denominator: { type: ["number", "null"] }
        sampleSize: { type: ["number", "null"] }
        source: { type: string }
        definition: { type: string }
        transformation: { type: string, enum: [RAW, NORMALIZED, DERIVED, DERIVED_FROM_STATCAST, HEURISTIC] }
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_SAMPLE, NOT_FOUND, QUARANTINED] }
        retrievedAt: { type: string }
      required: [key, label, value, unit, denominator, sampleSize, source, definition, transformation, status, retrievedAt]
    ResearchPanel:
      type: object
      properties:
        title: { type: string }
        metrics: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [title, metrics]
    ResearchIdentity:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        bats: { type: string }
        throws: { type: string }
        position: { type: string }
        rosterState: { type: string }
      required: [playerId, name, team, bats, throws, position, rosterState]
    ResearchProfile:
      type: object
      properties:
        identity: { $ref: "#/components/schemas/ResearchIdentity" }
        window: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: string }
        freshness: { type: string }
        role: { type: string }
        panels: { type: array, items: { $ref: "#/components/schemas/ResearchPanel" } }
        arsenal: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
        notes: { type: array, items: { type: string } }
      required: [identity, window, effectiveFrom, effectiveTo, freshness, role, panels, arsenal, notes]
    ResearchSearchResult:
      type: object
      properties:
        playerId: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        role: { type: string }
      required: [playerId, name, team, position, role]
    ResearchLab:
      type: object
      properties:
        sourceStatus: { type: string }
        searchResults: { type: array, items: { $ref: "#/components/schemas/ResearchSearchResult" } }
        searchResultLimit: { type: integer, minimum: 1 }
        searchResultsTruncated: { type: boolean }
        profile: { anyOf: [{ $ref: "#/components/schemas/ResearchProfile" }, { type: "null" }] }
        notices: { type: array, items: { type: string } }
      required: [sourceStatus, searchResults, searchResultLimit, searchResultsTruncated, profile, notices]
    BatterPitcherMetrics:
      type: object
      properties:
        avg: { type: ["number", "null"] }
        slg: { type: ["number", "null"] }
        xslg: { type: ["number", "null"] }
        xbh: { type: integer }
        homeRuns: { type: integer }
        walks: { type: integer }
        hardHitPercent: { type: ["number", "null"] }
        barrelPercent: { type: ["number", "null"] }
      required: [avg, slg, xslg, xbh, homeRuns, walks, hardHitPercent, barrelPercent]
    BatterPitcherArsenal:
      type: object
      properties:
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_SAMPLE, NOT_FOUND] }
        summary: { type: string }
        weightedXslg: { type: ["number", "null"] }
        pitchTypes: { type: integer }
      required: [status, summary, weightedXslg, pitchTypes]
    BatterPitcherEvidence:
      type: object
      description: Named-pair history is canonical-ID-only and subordinate to current aggregate and arsenal evidence. It never emits odds, probabilities, or recommendations.
      properties:
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_SAMPLE, NOT_FOUND] }
        source: { type: string }
        coverageStatus: { type: string }
        batterId: { type: integer }
        pitcherId: { type: integer }
        effectiveTo: { type: string, format: date }
        sampleBand: { type: string, enum: [ANECDOTE, WEAK_CONTEXT, SECONDARY_CONTEXT, MEANINGFUL_SUPPORT] }
        pa: { type: integer }
        metrics: { $ref: "#/components/schemas/BatterPitcherMetrics" }
        ageDays: { type: integer }
        decayWeight: { type: number }
        shrinkageWeight: { type: number }
        marketSignal: { type: number }
        rankAdjustment: { type: number }
        arsenal: { $ref: "#/components/schemas/BatterPitcherArsenal" }
        note: { type: string }
      required: [status, source, coverageStatus, batterId, pitcherId, effectiveTo, sampleBand, pa, metrics, ageDays, decayWeight, shrinkageWeight, marketSignal, rankAdjustment, arsenal, note]
    BatterPitcherRefresh:
      type: object
      properties:
        effectiveDate: { type: string, format: date }
        pairsRequested: { type: integer }
        pairsRefreshed: { type: integer }
        failures: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              batterId: { type: integer }
              pitcherId: { type: integer }
              status: { type: string, enum: [SUCCESS, FAILED] }
            required: [batterId, pitcherId, status]
      required: [effectiveDate, pairsRequested, pairsRefreshed, failures, results]
    ParkResearch:
      type: object
      properties:
        venue: { type: string }
        span: { type: string }
        factors: { type: array, items: { $ref: "#/components/schemas/ResearchMetric" } }
      required: [venue, span, factors]
    GameLab:
      type: object
      properties:
        date: { type: string }
        games: { type: array, items: { $ref: "#/components/schemas/SlateGame" } }
        selectedGame: { anyOf: [{ $ref: "#/components/schemas/SlateGame" }, { type: "null" }] }
        parkResearch: { anyOf: [{ $ref: "#/components/schemas/ParkResearch" }, { type: "null" }] }
        notes: { type: array, items: { type: string } }
      required: [date, games, selectedGame, parkResearch, notes]
    ResearchIngestResult:
      type: object
      properties:
        status: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/ResearchIngestSource" } }
        quarantinedRows: { type: number }
        notes: { type: array, items: { type: string } }
      required: [status, sources, quarantinedRows, notes]
    BullpenLeverageMap:
      type: object
      properties:
        projected9th: { type: ["integer", "null"] }
        projected8th: { type: ["integer", "null"] }
        projected7th: { type: ["integer", "null"] }
        highestLeverageLefty: { type: ["integer", "null"] }
        longMan: { type: ["integer", "null"] }
        highestWalkReliever: { type: ["integer", "null"] }
        lowestWalkReliever: { type: ["integer", "null"] }
        roleUncertainty: { type: boolean }
        notes: { type: ["string", "null"] }
        computedAt: { type: ["string", "null"] }
      required: [projected9th, projected8th, projected7th, highestLeverageLefty, longMan, highestWalkReliever, lowestWalkReliever, roleUncertainty, notes, computedAt]
    BullpenArm:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        throws: { type: string }
        role: { type: string }
        availability: { type: string, enum: [AVAILABLE, LIKELY_AVAILABLE, DOUBTFUL, OUT, UNKNOWN, STALE] }
        confidence: { type: string, enum: [HEURISTIC, MANAGER_OVERRIDE, UNKNOWN] }
        d1Pitches: { type: ["integer", "null"] }
        d2Pitches: { type: ["integer", "null"] }
        d3Pitches: { type: ["integer", "null"] }
        consecutiveDays: { type: integer }
        multiInningYesterday: { type: boolean }
        daysSinceLastUse: { type: ["integer", "null"] }
        managerOverride: { type: ["string", "null"] }
        managerOverrideNote: { type: ["string", "null"] }
        staleBadge: { type: boolean }
        sourceFreshness: { type: ["string", "null"] }
        computedAt: { type: ["string", "null"] }
        roleHistory:
          type: array
          items: { $ref: "#/components/schemas/RoleHistoryEntry" }
      required: [playerId, name, throws, role, availability, confidence, d1Pitches, d2Pitches, d3Pitches, consecutiveDays, multiInningYesterday, daysSinceLastUse, managerOverride, managerOverrideNote, staleBadge, sourceFreshness, computedAt, roleHistory]
    RoleHistoryEntry:
      type: object
      properties:
        changeId: { type: string }
        previousRole: { type: ["string", "null"] }
        newRole: { type: string }
        changeType: { type: string }
        effectiveDate: { type: string }
        source: { type: string }
        notes: { type: ["string", "null"] }
        recordedAt: { type: string }
      required: [changeId, previousRole, newRole, changeType, effectiveDate, source, notes, recordedAt]
    BullpenUsageEntry:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        pitches: { type: integer }
        ip: { type: string }
        multiInning: { type: boolean }
      required: [playerId, name, pitches, ip, multiInning]
    BullpenUsage:
      type: object
      properties:
        d1: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
        d2: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
        d3: { type: array, items: { $ref: "#/components/schemas/BullpenUsageEntry" } }
      required: [d1, d2, d3]
    BullpenTeam:
      type: object
      properties:
        teamId: { type: integer }
        abbreviation: { type: string }
        name: { type: string }
        slateDate: { type: string }
        leverageMap: { $ref: "#/components/schemas/BullpenLeverageMap" }
        arms: { type: array, items: { $ref: "#/components/schemas/BullpenArm" } }
        usage: { $ref: "#/components/schemas/BullpenUsage" }
        coveragePercentage: { type: number }
        staleBadge: { type: boolean }
        computedAt: { type: ["string", "null"] }
      required: [teamId, abbreviation, name, slateDate, leverageMap, arms, usage, coveragePercentage, staleBadge, computedAt]
    BullpenRoomSummary:
      type: object
      properties:
        teamsWithData: { type: integer }
        teamsStale: { type: integer }
        totalArms: { type: integer }
        armsAvailable: { type: integer }
        armsLikelyAvailable: { type: integer }
        armsDoubtful: { type: integer }
        armsOut: { type: integer }
        armsUnknown: { type: integer }
      required: [teamsWithData, teamsStale, totalArms, armsAvailable, armsLikelyAvailable, armsDoubtful, armsOut, armsUnknown]
    BullpenRoom:
      type: object
      properties:
